name: E2E - Lovable badge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lovable-badge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_CLS_LIMIT: "0.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.47.0"
          python -m playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 8080 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "server up"; exit 0
            fi
            sleep 0.5
          done
          echo "server failed to start"; cat /tmp/vite.log; exit 1

      - name: Run E2E — badge hidden + CLS budget (with retry)
        env:
          E2E_ARTIFACTS_DIR: test-artifacts/lovable-badge
          E2E_MAX_ATTEMPTS: "3"
          E2E_RETRY_DELAY_SECONDS: "5"
          E2E_DEBUG: "1"
        run: |
          set +e
          max="${E2E_MAX_ATTEMPTS:-3}"
          delay="${E2E_RETRY_DELAY_SECONDS:-5}"
          attempt=1
          final_status=1
          while [ "$attempt" -le "$max" ]; do
            echo "::group::E2E attempt $attempt/$max"
            # Isola artefatos por tentativa — preservados mesmo se uma tentativa
            # posterior passar, para auditar instabilidade em modo debug.
            attempt_dir="test-artifacts/lovable-badge-attempt-$attempt"
            E2E_ARTIFACTS_DIR="$attempt_dir" E2E_DEBUG=1 python tests/e2e/lovable_badge_test.py
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "E2E passou na tentativa $attempt"
              rm -rf test-artifacts/lovable-badge
              cp -r "$attempt_dir" test-artifacts/lovable-badge
              final_status=0
              break
            fi
            echo "Tentativa $attempt falhou (exit=$status)"
            rm -rf test-artifacts/lovable-badge
            cp -r "$attempt_dir" test-artifacts/lovable-badge
            if [ "$attempt" -lt "$max" ]; then
              echo "Aguardando ${delay}s antes de retentar..."
              sleep "$delay"
            fi
            attempt=$((attempt + 1))
          done
          if [ "$final_status" -ne 0 ]; then
            echo "E2E falhou após $max tentativas — limite de CLS e detecção do badge mantidos"
          fi
          exit "$final_status"

      - name: Build HTML report (always)
        if: always()
        run: python tests/e2e/build_report.py --root test-artifacts --out test-artifacts/report.html || true

      - name: Upload E2E debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lovable-badge-e2e-debug
          path: |
            test-artifacts/report.html
            test-artifacts/lovable-badge/**
            test-artifacts/lovable-badge-attempt-*/**
            /tmp/vite.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/vite.pid)" 2>/dev/null || true

